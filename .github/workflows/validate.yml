name: AetherVFX Release Gates & CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Pure Runtime, Schema, and Shader Gates
        run: npm run test:unit

      - name: Production Static Bundle Build
        run: npm run build

      - name: Playwright Browser Test Suite
        run: npm run test:browser

      - name: Deterministic Performance Benchmark Smoke Gate
        run: npm run test:perf:smoke

      - name: Clean Static Dist Smoke
        run: npm run test:static

  visual-darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # Bootstrap only for the bounded repair branch. The follow-up repair commit
      # replaces this with a normal regression-only `npm run test:visual` gate
      # after the reviewed Darwin goldens are committed.
      - name: Generate deterministic Darwin visual baseline candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'phase6-release-repair'
        run: npm run test:visual:update && npm run test:visual

      - name: Upload Darwin visual baseline candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'phase6-release-repair'
        uses: actions/upload-artifact@v4
        with:
          name: aethervfx-darwin-visual-baseline
          path: tests/visual.spec.ts-snapshots/*.png
          if-no-files-found: error

      - name: Darwin Visual Regression Gate
        if: github.event_name != 'pull_request' || github.head_ref != 'phase6-release-repair'
        run: npm run test:visual
