name: AetherVFX Release Gates & CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Pure Runtime, Schema, and Shader Gates
        run: npm run test:unit

      - name: Production Static Bundle Build
        run: npm run build

      - name: Playwright Browser Test Suite
        run: npm run test:browser

      - name: Deterministic Performance Benchmark Smoke Gate
        run: npm run test:perf:smoke

      - name: Clean Static Dist Smoke
        run: npm run test:static

  visual-darwin:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Detect reviewed Darwin baseline
        id: visual_baseline
        shell: bash
        run: |
          if [[ -f tests/visual.spec.ts-snapshots/fixture-01-particle-orb-chromium-darwin.png ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # One-time bootstrap for this exact repair branch. The generated set from the
      # preceding CI run was manually reviewed before this gate was enabled. Once
      # committed, all subsequent PR/main runs are regression-only.
      - name: Commit reviewed deterministic Darwin baselines and blocked repair state
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase6-release-repair' && steps.visual_baseline.outputs.present == 'false'
        shell: bash
        run: |
          rm -f tests/visual.spec.ts-snapshots/*.png
          npm run test:visual:update
          npm run test:visual

          node <<'NODE'
          const fs = require('fs');
          const path = 'OPERATIONAL_STATE.md';
          let text = fs.readFileSync(path, 'utf8');

          const replacements = [
            [
              '"state_revision":21,"last_updated":"2026-08-16T10:45:00Z","current_baseline":{"identity":"Phase 6 complete: Performance, Visual Regression, and Mandatory Release Gates verified","state":"release-candidate","last_verified":"2026-08-16T10:45:00Z"}',
              '"state_revision":22,"last_updated":"2026-08-16T14:20:00Z","current_baseline":{"identity":"Phase 6 release-gate repair candidate; final release verification pending reference performance baseline","state":"repair-candidate","last_verified":"2026-08-16T14:20:00Z"}'
            ],
            [
              '- **Phase 6: Performance, Visual Regression, and Mandatory Release Gates is VERIFIED COMPLETE**:',
              '- **Phase 6 implementation is published but RELEASE VERIFICATION IS BLOCKED pending the corrected reference performance baseline/regression and final green main CI**:'
            ],
            [
              '- All six roadmap phases are verified complete with empirical automated and browser evidence.',
              '- Phases 1-5 remain verified. Phase 6 is a repair candidate until the corrected reference performance baseline/regression and final green main CI are recorded.'
            ],
            [
              '- **Platform Status:** All Phases 1 through 6 of the accepted AetherVFX ROADMAP are **VERIFIED COMPLETE**.',
              '- **Platform Status:** Phases 1-5 are **VERIFIED COMPLETE**. Phase 6 source is implemented and under repaired release-gate validation; release status remains blocked pending the corrected reference performance baseline/regression and final green main CI.'
            ],
            [
              '| 21 | **Phase 6 complete: Performance, Visual Regression, and Release Gates.** Implemented real Performance Lab test harness with 10 deterministic scenarios (zero memory/texture leaks); automated baseline regression comparator (`benchmarks/performance/baseline.json`); Playwright visual regression suite with 8 golden snapshots (`tests/visual.spec.ts`); Playwright browser functional/security suite (`tests/browser.spec.ts`); GLSL shader safety gate (`scripts/shader-safety-check.ts`); GitHub Actions CI (`.github/workflows/validate.yml`); static preview build verification; licensing/provenance inventory (`LICENSE`, `THIRD_PARTY_NOTICES.md`, `PROVENANCE.md`); and full framework documentation (`README.md`). All release gates verified. |',
              '| 21 | **Phase 6 implementation checkpoint (later found to overclaim release verification).** Performance/visual/CI/provenance source was published, but post-publication audit found failed final CI, invalid frame timing/baseline identity, nondeterministic visual fixtures/tolerance, discrete scaling gaps, and incomplete upstream MIT provenance. |\n| 22 | **Phase 6 release-gate repair candidate.** Corrected CI ordering, RAF-to-RAF performance timing with fixed-step simulation, build identity, discrete scaling profiles, deterministic <=2% visual fixtures, dist-only static smoke, and upstream MIT notice/provenance. Invalid old benchmark JSON was removed. Release remains blocked until the headed reference performance baseline/repeatability/regression evidence is generated for this repair source and final main CI is green. |'
            ],
          ];

          for (const [before, after] of replacements) {
            if (!text.includes(before)) {
              throw new Error(`Operational-state repair anchor missing: ${before.slice(0, 80)}`);
            }
            text = text.replace(before, after);
          }

          fs.writeFileSync(path, text);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OPERATIONAL_STATE.md tests/visual.spec.ts-snapshots/*.png
          git commit -m "Add deterministic Darwin visual baselines and repair state"
          git push origin HEAD:phase6-release-repair

      - name: Darwin Visual Regression Gate
        if: steps.visual_baseline.outputs.present == 'true'
        run: npm run test:visual
